name: PR9 Format

on:
  push:
    branches: [feat/pr9-match-entry]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr9-match-entry
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/server/src/match-entry.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/match-entry.ts
          git commit -m "style: format final PR9 service"
          git push origin HEAD:feat/pr9-match-entry
