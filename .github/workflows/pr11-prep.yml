name: PR11 Prep

on:
  push:
    branches:
      - feat/pr11-miniapp-play-flow

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr11-miniapp-play-flow
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only
      - name: Sync source-of-truth docs
        run: |
          python - <<'PY'
          from pathlib import Path

          docs = Path('docs/README.md')
          text = docs.read_text()
          if 'architecture/12-miniapp-play-flow.md' not in text:
              text = text.replace(
                  '- [`architecture/11-telegram-entry.md`](architecture/11-telegram-entry.md) — thin Telegram launch/deep-link boundary, webhook security, and target production routing.\n',
                  '- [`architecture/11-telegram-entry.md`](architecture/11-telegram-entry.md) — thin Telegram launch/deep-link boundary, webhook security, and target production routing.\n- [`architecture/12-miniapp-play-flow.md`](architecture/12-miniapp-play-flow.md) — Mini App launch context, match-entry orchestration, private sharing, and authoritative realtime/resync client.\n'
              )
          docs.write_text(text)

          dev = Path('docs/development/README.md')
          text = dev.read_text()
          text = text.replace(
              'Client Play/match UI/realtime transport and production application deployment remain intentionally unimplemented unless later documentation says otherwise.',
              'Mini App Play/match-entry/realtime orchestration is implemented; the interactive tutorial, full card-table interaction/polish, and production application deployment remain intentionally unimplemented unless later documentation says otherwise.'
          )
          text = text.replace(
              '  miniapp/       React/Vite shell + platform/auth bootstrap',
              '  miniapp/       React/Vite Play + platform/auth + match-entry/realtime orchestration'
          )
          text = text.replace(
              '`bot` now exposes a minimal Telegram webhook runtime with `/start`, Mini App launch buttons, challenge deep-link fallback, and `/health`; it remains non-authoritative for accounts, challenges, and gameplay. `server` exposes authenticated HTTP match-entry routes and `/ws` for authenticated gameplay realtime. The Mini App does not yet consume launch context or contain the production Play/matchmaking flow or match WebSocket client/UI.',
              '`bot` exposes a minimal Telegram webhook runtime with `/start`, Mini App launch buttons, challenge deep-link fallback, and `/health`; it remains non-authoritative for accounts, challenges, and gameplay. `server` exposes authenticated HTTP match-entry routes and `/ws` for authenticated gameplay realtime. The Mini App now consumes validated launch context, restores/renews casual matchmaking, creates and resolves private challenge flows, and connects to matches through a validated RESYNC/reconnect WebSocket client. Full card-table interaction and the interactive tutorial remain later focused layers.'
          )
          text = text.replace(
              'BOT_USERNAME=replace_with_bot_username\nBOT_HOST=0.0.0.0',
              'BOT_USERNAME=replace_with_bot_username\nVITE_TELEGRAM_BOT_USERNAME=replace_with_bot_username\nBOT_HOST=0.0.0.0'
          )
          text = text.replace(
              'In local development the current Vite shell proxies `/api` to `127.0.0.1:3000`; client-side Play and `/ws` integration belong to the upcoming client layer.',
              'In local development Vite proxies both `/api` and `/ws` to `127.0.0.1:3000`, so the implemented Play flow exercises the same authenticated HTTP and realtime boundaries as production composition will expose.'
          )
          text = text.replace(
              'The game engine, protocol, authoritative match service, durable match store, Telegram verifier, server configuration, authenticated HTTP runtime, match-entry lifecycle, realtime lifecycle, actual WebSocket transport, and Telegram bot entry runtime have substantive automated tests.',
              'The game engine, protocol, authoritative match service, durable match store, Telegram verifier, server configuration, authenticated HTTP runtime, match-entry lifecycle, realtime lifecycle, actual WebSocket transport, Telegram bot entry runtime, and Mini App API/realtime boundaries have substantive automated tests.'
          )
          if '../architecture/12-miniapp-play-flow.md' not in text:
              text = text.replace(
                  '17. [`../architecture/11-telegram-entry.md`](../architecture/11-telegram-entry.md)',
                  '17. [`../architecture/11-telegram-entry.md`](../architecture/11-telegram-entry.md)\n18. [`../architecture/12-miniapp-play-flow.md`](../architecture/12-miniapp-play-flow.md)'
              )
          dev.write_text(text)

          arch = Path('docs/architecture/01-technical-foundation.md')
          text = arch.read_text()
          text = text.replace(
              'The Mini App has a Telegram platform adapter and authentication bootstrap but remains a minimal shell. Client Play/match UI/reconnect transport and production backend composition remain intentionally unimplemented rather than represented by fake placeholders.',
              'The Mini App has a Telegram platform adapter, authentication bootstrap, durable match-entry Play flow, challenge launch/share handling, and validated WebSocket RESYNC/reconnect transport. The interactive tutorial, full card-table interaction/presentation, and production backend composition remain intentionally unimplemented rather than represented by fake placeholders.'
          )
          text = text.replace(
              'See [`06-authoritative-match-service.md`](06-authoritative-match-service.md) for the service boundary, [`07-durable-match-persistence.md`](07-durable-match-persistence.md) for durable storage/recovery, [`08-authenticated-server-runtime.md`](08-authenticated-server-runtime.md) for HTTP/authentication/session boundaries, [`09-authenticated-realtime-runtime.md`](09-authenticated-realtime-runtime.md) for WebSocket/reconnect/deadline behavior, [`10-match-entry.md`](10-match-entry.md) for casual/private match entry behavior, and [`11-telegram-entry.md`](11-telegram-entry.md) for the thin Telegram launch/deep-link boundary.',
              'See [`06-authoritative-match-service.md`](06-authoritative-match-service.md) for the service boundary, [`07-durable-match-persistence.md`](07-durable-match-persistence.md) for durable storage/recovery, [`08-authenticated-server-runtime.md`](08-authenticated-server-runtime.md) for HTTP/authentication/session boundaries, [`09-authenticated-realtime-runtime.md`](09-authenticated-realtime-runtime.md) for WebSocket/reconnect/deadline behavior, [`10-match-entry.md`](10-match-entry.md) for casual/private match entry behavior, [`11-telegram-entry.md`](11-telegram-entry.md) for the thin Telegram launch/deep-link boundary, and [`12-miniapp-play-flow.md`](12-miniapp-play-flow.md) for Mini App match-entry/realtime orchestration.'
          )
          text = text.replace(
              'match-entry request/response shapes, and strict runtime boundary schemas.',
              'match-entry request/response shapes, shared launch-context contracts, and strict runtime boundary schemas.'
          )
          arch.write_text(text)
          PY
      - name: Format repository
        run: pnpm format
      - name: Verify client and protocol layers
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Remove temporary workflow
        run: rm .github/workflows/pr11-prep.yml
      - name: Commit prepared branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize PR11 workspace and docs"
          git push origin HEAD:feat/pr11-miniapp-play-flow
