name: PR8 Shutdown Fix

on:
  push:
    branches: [feat/pr8-realtime-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr8-realtime-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded websocket shutdown
        run: echo '' | base64 --decode > /tmp/pr8_shutdown_patch.py && python /tmp/pr8_shutdown_patch.py
      - run: pnpm exec prettier --write apps/server/src/realtime.ts
      - name: Commit shutdown fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src/realtime.ts
          git commit -m "fix(server): bound websocket shutdown handshake"
          git push origin HEAD:feat/pr8-realtime-runtime
