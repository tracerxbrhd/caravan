name: Verify

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: caravan_test
          POSTGRES_USER: caravan
          POSTGRES_PASSWORD: caravan-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caravan -d caravan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: docker compose config
      - run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - run: pnpm build
      - run: pnpm --filter @caravan/server db:migrate
        env:
          DATABASE_URL: postgresql://caravan:caravan-test@127.0.0.1:5432/caravan_test
      - run: pnpm verify
        env:
          DATABASE_URL: postgresql://caravan:caravan-test@127.0.0.1:5432/caravan_test
          CARAVAN_REQUIRE_DATABASE_TESTS: '1'
      - run: pnpm audit --prod --audit-level high
      - name: Build production images
        run: docker compose --env-file .env.production.example -f compose.production.yaml build
      - name: Validate production Caddy configuration
        run: docker compose --env-file .env.production.example -f compose.production.yaml run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke production stack
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml up -d --wait db
          docker compose --env-file .env.production.example -f compose.production.yaml run --rm --no-deps server node dist/migrate-cli.js
          docker compose --env-file .env.production.example -f compose.production.yaml up -d --wait
          curl --fail --show-error --silent http://127.0.0.1:18081/ > /dev/null
          curl --fail --show-error --silent http://127.0.0.1:18081/health > /dev/null
          curl --fail --show-error --silent http://127.0.0.1:18081/ready > /dev/null
      - name: Diagnose production smoke failure
        if: failure()
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml ps || true
          docker compose --env-file .env.production.example -f compose.production.yaml logs --no-color --tail=200 db server bot web || true
      - name: Stop production smoke stack
        if: always()
        run: docker compose --env-file .env.production.example -f compose.production.yaml down -v --remove-orphans
