name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/authoritative-match-service
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - name: Format server changes
        run: |
          pnpm prettier --write apps/server/src apps/server/test
          if git diff --quiet -- apps/server; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server
          git commit -m "style(server): apply Prettier"
          git push origin HEAD:feat/authoritative-match-service
      - run: pnpm verify
      - run: pnpm audit --prod --audit-level high
