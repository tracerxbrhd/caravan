name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://caravan:caravan-test@127.0.0.1:5432/caravan_test
      CARAVAN_REQUIRE_DATABASE_TESTS: '1'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: caravan_test
          POSTGRES_USER: caravan
          POSTGRES_PASSWORD: caravan-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caravan -d caravan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: docker compose config
      - run: pnpm --filter @caravan/server build
      - run: pnpm --filter @caravan/server db:migrate
      - run: pnpm verify
      - run: pnpm audit --prod --audit-level high
