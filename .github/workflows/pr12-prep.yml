name: PR12 Prep

on:
  push:
    branches:
      - feat/pr12-interactive-card-table

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr12-interactive-card-table
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - name: Sync strict client code and source-of-truth docs
        run: |
          python - <<'PY'
          from pathlib import Path

          table = Path('apps/miniapp/src/CardTable.tsx')
          text = table.read_text()
          old = """<PlayingCard
                card={node.card}
                target={target}
                disabled={disabled}
                onClick={target ? onTarget : undefined}
              />"""
          new = """{target ? (
                <PlayingCard card={node.card} target disabled={disabled} onClick={onTarget} />
              ) : (
                <PlayingCard card={node.card} />
              )}"""
          if old not in text:
              raise SystemExit('CardTable strict optional-prop snippet not found')
          table.write_text(text.replace(old, new))

          product = Path('docs/product/07-match-ux-and-tutorial.md')
          text = product.read_text()
          text = text.replace(
              'Accepted as the initial interaction contract for the CARAVAN match experience. This describes intended behavior, not implemented UI.\n\nThe purpose of this document is to make the first client feel like a coherent digital card table while keeping the game client non-authoritative.',
              'Accepted as the interaction contract for the CARAVAN match experience. The competitive tap-select/tap-target table foundation is implemented; richer confirmed-transition choreography, sound/haptics, and the interactive tutorial remain follow-up work.\n\nThe purpose of this document is to keep the client feeling like a coherent digital card table while keeping the game client non-authoritative.'
          )
          product.write_text(text)

          arch12 = Path('docs/architecture/12-miniapp-play-flow.md')
          text = arch12.read_text()
          text = text.replace(
              'PR11 itself does not yet expose card actions in the UI. That remains the next focused card-table layer.\n\n## Presentation boundary\n\nThe current match screen is intentionally a read-only connection/session shell. It shows enough sanitized route/turn state to prove that the player has reached the authoritative match without claiming that the full gameplay UX is finished.\n\nThe next table implementation should consume the existing `MatchSnapshot`, `legalActions`, and realtime send helpers rather than building another match transport.',
              'PR11 introduced typed state-changing helpers without exposing them through card controls. The interactive table added later consumes those helpers directly; see [`13-interactive-card-table.md`](13-interactive-card-table.md).\n\n## Presentation boundary\n\nThe match transport remains independent from table presentation. The interactive table consumes the existing `MatchSnapshot`, `legalActions`, and realtime send helpers rather than building another match transport or client-owned rules layer.'
          )
          text = text.replace(
              '- card selection and legal-target highlighting;\n- tactile deal/play/modifier/discard animations;',
              '- richer confirmed deal/play/modifier/discard travel animations beyond the implemented selection/target feedback;'
          )
          arch12.write_text(text)

          dev = Path('docs/development/README.md')
          text = dev.read_text()
          text = text.replace(
              'Mini App Play/match-entry/realtime orchestration is implemented; the interactive tutorial, full card-table interaction/polish, and production application deployment remain intentionally unimplemented unless later documentation says otherwise.',
              'Mini App Play/match-entry/realtime orchestration and the legal-action-driven interactive card table are implemented; the interactive tutorial, richer tactile transition/audio/haptic polish, and production application deployment remain intentionally unimplemented unless later documentation says otherwise.'
          )
          text = text.replace(
              '18. [`../architecture/12-miniapp-play-flow.md`](../architecture/12-miniapp-play-flow.md)',
              '18. [`../architecture/12-miniapp-play-flow.md`](../architecture/12-miniapp-play-flow.md)\n19. [`../architecture/13-interactive-card-table.md`](../architecture/13-interactive-card-table.md)'
          )
          text = text.replace(
              '  miniapp/       React/Vite Play + platform/auth + match-entry/realtime orchestration',
              '  miniapp/       React/Vite Play + auth/match-entry/realtime + interactive card table'
          )
          text = text.replace(
              'The Mini App now consumes validated launch context, restores/renews casual matchmaking, creates and resolves private challenge flows, and connects to matches through a validated RESYNC/reconnect WebSocket client. Full card-table interaction and the interactive tutorial remain later focused layers.',
              'The Mini App consumes validated launch context, restores/renews casual matchmaking, creates and resolves private challenge flows, connects through a validated RESYNC/reconnect WebSocket client, and renders an interactive table directly from sanitized `PlayerView` plus server-projected `legalActions`. The interactive tutorial and richer confirmed-transition/audio/haptic polish remain later focused layers.'
          )
          text = text.replace(
              'The game engine, protocol, authoritative match service, durable match store, Telegram verifier, server configuration, authenticated HTTP runtime, match-entry lifecycle, realtime lifecycle, actual WebSocket transport, Telegram bot entry runtime, and Mini App API/realtime boundaries have substantive automated tests.',
              'The game engine, protocol, authoritative match service, durable match store, Telegram verifier, server configuration, authenticated HTTP runtime, match-entry lifecycle, realtime lifecycle, actual WebSocket transport, Telegram bot entry runtime, Mini App API/realtime boundaries, and the card-table legal-action affordance model have substantive automated tests.'
          )
          dev.write_text(text)
          PY
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Verify non-database workspace
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Remove temporary workflow
        run: rm .github/workflows/pr12-prep.yml
      - name: Commit prepared branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: finalize PR12 card table and docs'
          git push origin HEAD:feat/pr12-interactive-card-table
