name: PR14 Prep

on:
  push:
    branches:
      - feat/pr14-results-rematch

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://caravan:caravan-test@127.0.0.1:5432/caravan_test
      CARAVAN_REQUIRE_DATABASE_TESTS: '1'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: caravan_test
          POSTGRES_USER: caravan
          POSTGRES_PASSWORD: caravan-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caravan -d caravan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr14-results-rematch
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - name: Sync PR14 docs and lifecycle details
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new))

          replace(
              'apps/miniapp/src/MatchSession.tsx',
              "  useEffect(() => {\n    setSnapshot(null);\n    setRematch(IDLE_REMATCH);",
              "  useEffect(() => {\n    setConnectionState('CONNECTING');\n    setSnapshot(null);\n    setRematch(IDLE_REMATCH);"
          )

          replace(
              'README.md',
              '> **Status:** active first-playable development. Core rules, authoritative multiplayer, Telegram entry, matchmaking/challenges, realtime recovery, and the interactive card table are implemented; production deployment and final game-feel/result layers are still in progress.',
              '> **Status:** active first-playable development. Core rules, authoritative multiplayer, Telegram entry, matchmaking/challenges, realtime recovery, the interactive card table, rules guide, and result/rematch loop are implemented; production deployment and richer game-feel polish are still in progress.'
          )

          replace(
              'docs/product/07-match-ux-and-tutorial.md',
              'Accepted as the interaction contract for the CARAVAN match experience. The competitive tap-select/tap-target table and visual rules guide are implemented; richer confirmed-transition choreography and sound/haptics remain follow-up work.',
              'Accepted as the interaction contract for the CARAVAN match experience. The competitive tap-select/tap-target table, visual rules guide, authoritative result surface, and direct rematch loop are implemented; richer confirmed-transition choreography and sound/haptics remain follow-up work.'
          )

          replace(
              'docs/architecture/01-technical-foundation.md',
              'The Mini App has a Telegram platform adapter, authentication bootstrap, durable match-entry Play flow, challenge launch/share handling, validated WebSocket RESYNC/reconnect transport, a legal-action-driven interactive card table, and an optional visual rules guide. Richer tactile transition/audio/haptic polish and production application composition remain intentionally unimplemented rather than represented by fake placeholders.',
              'The Mini App has a Telegram platform adapter, authentication bootstrap, durable match-entry Play flow, challenge launch/share handling, validated WebSocket RESYNC/reconnect transport, a legal-action-driven interactive card table, an optional visual rules guide, authoritative result presentation, and a durable direct-rematch loop. Richer tactile transition/audio/haptic polish and production application composition remain intentionally unimplemented rather than represented by fake placeholders.'
          )
          replace(
              'docs/architecture/01-technical-foundation.md',
              'durable casual matchmaking/private challenge routes, and authenticated `/ws` gameplay transport.',
              'durable casual matchmaking/private challenge/rematch routes, and authenticated `/ws` gameplay transport.'
          )
          replace(
              'docs/architecture/01-technical-foundation.md',
              'See [`13-interactive-card-table.md`](13-interactive-card-table.md) for the match surface and [`14-rules-guide.md`](14-rules-guide.md) for the optional onboarding/help boundary.',
              'See [`13-interactive-card-table.md`](13-interactive-card-table.md) for the match surface, [`14-rules-guide.md`](14-rules-guide.md) for the optional onboarding/help boundary, and [`15-results-and-rematch.md`](15-results-and-rematch.md) for post-match result/rematch coordination.'
          )
          replace(
              'docs/architecture/01-technical-foundation.md',
              'PostgreSQL is the durable source of truth for authoritative match persistence, account identity mapping, application sessions, casual queue membership, and private challenge lifecycle unless an accepted architecture decision changes it.',
              'PostgreSQL is the durable source of truth for authoritative match persistence, account identity mapping, application sessions, casual queue membership, private challenge lifecycle, and rematch coordination unless an accepted architecture decision changes it.'
          )

          replace(
              'docs/architecture/12-miniapp-play-flow.md',
              'Implemented as the first CARAVAN Mini App application flow that reaches durable match entry and an authoritative realtime match snapshot. It deliberately stops before the full interactive card-table presentation and later visual rules-guide layer.',
              'Implemented as the foundational CARAVAN Mini App application flow for durable match entry and authoritative realtime snapshots. Later focused layers now build the interactive card table, visual rules guide, and result/rematch loop on top of this same transport rather than replacing it.'
          )
          p = Path('docs/architecture/12-miniapp-play-flow.md')
          text = p.read_text()
          text = text.replace('- the visual rules guide (implemented later; see `14-rules-guide.md`);\n', '')
          text = text.replace('- complete result/rematch UX;\n', '')
          text = text.replace('Those remain separate focused first-playable layers.', 'The remaining items stay separate focused presentation/platform layers.')
          p.write_text(text)

          p = Path('docs/development/README.md')
          text = p.read_text()
          text = text.replace(
              'Mini App Play/match-entry/realtime orchestration, the legal-action-driven interactive card table, and the optional visual rules guide are implemented; richer tactile transition/audio/haptic polish and production application deployment remain intentionally unimplemented unless later documentation says otherwise.',
              'Mini App Play/match-entry/realtime orchestration, the legal-action-driven interactive card table, the optional visual rules guide, authoritative match results, and durable direct rematches are implemented; richer tactile transition/audio/haptic polish and production application deployment remain intentionally unimplemented unless later documentation says otherwise.'
          )
          text = text.replace(
              '20. [`../architecture/14-rules-guide.md`](../architecture/14-rules-guide.md)',
              '20. [`../architecture/14-rules-guide.md`](../architecture/14-rules-guide.md)\n21. [`../architecture/15-results-and-rematch.md`](../architecture/15-results-and-rematch.md)'
          )
          text = text.replace(
              'miniapp/       React/Vite Play + auth/match-entry/realtime + interactive card table',
              'miniapp/       React/Vite Play + auth/match-entry/realtime + table + results/rematch'
          )
          text = text.replace(
              'server/        authenticated HTTP/WS runtime + match entry + authoritative match service + PostgreSQL persistence',
              'server/        authenticated HTTP/WS + entry/rematch + authoritative match service + PostgreSQL'
          )
          text = text.replace(
              'durable casual matchmaking, private challenge lifecycle, controlling socket ownership, heartbeat, reconnect grace, and turn deadlines.',
              'durable casual matchmaking, private challenge lifecycle, durable rematch coordination, controlling socket ownership, heartbeat, reconnect grace, and turn deadlines.'
          )
          text = text.replace(
              'The optional visual rules guide is also implemented and remains available before and during matches. Richer confirmed-transition/audio/haptic polish remains a later focused layer.',
              'The optional visual rules guide is also implemented and remains available before and during matches. Finished snapshots now produce the player-facing result surface and durable same-opponent rematch handshake without adding another gameplay transport. Richer confirmed-transition/audio/haptic polish remains a later focused layer.'
          )
          text = text.replace(
              'CHALLENGE_TTL_SECONDS=900\nBOT_USERNAME=',
              'CHALLENGE_TTL_SECONDS=900\nREMATCH_TTL_SECONDS=900\nBOT_USERNAME='
          )
          text = text.replace(
              'POST   /api/challenges/:challengeId/cancel\nGET    /ws',
              'POST   /api/challenges/:challengeId/cancel\nGET    /api/matches/:matchId/rematch\nPOST   /api/matches/:matchId/rematch\nDELETE /api/matches/:matchId/rematch\nGET    /ws'
          )
          text = text.replace(
              'Challenge acceptance and casual pairing both create gameplay state only through the existing authoritative `MatchService`.',
              'Challenge acceptance, casual pairing, and a mutually accepted rematch all create gameplay state only through the existing authoritative `MatchService`. Rematch requests are durable, source-match-scoped, and require both finished-match participants before one fresh match is created.'
          )
          text = text.replace(
              'the card-table legal-action affordance model, and rules-guide presentation have substantive automated tests.',
              'the card-table legal-action affordance model, rules-guide presentation, result presentation, and rematch concurrency/API lifecycle have substantive automated tests.'
          )
          p.write_text(text)
          PY
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Verify repository
        run: |
          docker compose config
          pnpm build
          pnpm --filter @caravan/server db:migrate
          pnpm verify
          pnpm audit --prod --audit-level high
      - name: Remove temporary workflow
        run: rm .github/workflows/pr14-prep.yml
      - name: Commit prepared branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: finalize PR14 results and rematch'
          git push origin HEAD:feat/pr14-results-rematch
