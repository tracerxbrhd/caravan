name: Format PR7

on:
  push:
    branches: ['feat/server-auth-runtime']
    paths:
      - .github/workflows/format-pr7.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --allow-scripts=pnpm pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/server/test/runtime-auth.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/test/runtime-auth.integration.test.ts
          git commit -m 'style(server): format auth runtime integration test'
          git push
