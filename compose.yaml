name: caravan

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caravan}
      POSTGRES_USER: ${POSTGRES_USER:-caravan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caravan-local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-caravan} -d ${POSTGRES_DB:-caravan}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
